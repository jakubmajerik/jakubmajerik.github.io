<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<title>Profesionálni hráči Brawl Stars</title>

<style>

body{
    background-color:#ff69b4;
    font-family:Arial,sans-serif;
    color:white;
    margin:0;
}

/* NADPIS */
h2{
    text-align:center;
    font-size:40px;
    color:yellow;
    text-shadow:2px 2px 5px black;
    margin-top:20px;
}

/* KARTY */
.images{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin-top:30px;
}

.card{
    text-align:center;
    border:3px solid black;
    padding:15px;
    background-color:#444;
    border-radius:15px;
    width:220px;
    box-shadow:0 0 10px black;
}

/* MENÁ */
.card h3{
    color:#00ffff;
    font-size:24px;
}

/* OBRÁZKY */
img{
    width:200px;
    height:300px;
    border-radius:10px;
    margin-bottom:10px;
}

/* TLAČIDLÁ */
.btn{
    display:inline-block;
    padding:10px 18px;
    background-color:#2196F3;
    color:white;
    text-decoration:none;
    border-radius:10px;
    font-weight:bold;
    transition:0.3s;
}

.btn:hover{
    background-color:#0b63b6;
    transform:scale(1.05);
}

/* VIDEO */
.video-box{
    text-align:center;
    margin-top:40px;
}

.video-box h3{
    color:yellow;
    font-size:30px;
}

/* ODKAZ VLAVO DOLE */
.footer-link{
    position:fixed;
    bottom:10px;
    left:10px;
    background-color:black;
    padding:10px;
    border-radius:10px;
}

.footer-link a{
    color:#00ffcc;
    text-decoration:none;
    font-weight:bold;
    font-size:18px;
}

.footer-link a:hover{
    color:yellow;
}

</style>
</head>

<body>

<h2>Profesionálni hráči Brawl Stars</h2>

<div class="images">

    <div class="card">
        <h3>Jopo</h3>
        <img src="images/jopo.jpg" alt="Jopo">
        <a href="o mne.html" class="btn">O Jopovi</a>
    </div>

    <div class="card">
        <h3>Marko</h3>
        <img src="images/marko.jpg" alt="Marko">
        <a href="o marekovi markovi.html" class="btn">O Markovi</a>
    </div>

    <div class="card">
        <h3>Aďo</h3>
        <img src="images/adko.jpg" alt="Aďo">
        <a href="tekute.html" class="btn">O Aďovi</a>
    </div>

</div>

<div class="video-box">
    <h3>🎬 Guess The Brawler</h3>

    <video controls width="400">
        <source src="pocoloco.mp4" type="video/mp4">
        Tvoj prehliadač nepodporuje video.
    </video>
</div>

<!-- ODKAZ VLAVO DOLE -->
<div class="footer-link">
    <a href="https://cs.wikipedia.org/wiki/Brawl_Stars" target="_blank">
        Brawl Stars Wiki
    </a>
</div>

</body>
</html>

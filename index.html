<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <title>Profesionálni hráči Brawl Stars</title>

  <style>
    body {
        background-color: #ff69b4;
        font-family: Arial, sans-serif;
        color: white;
    }

    h2 {
        text-align: center;
    }

    .images {
        display: flex;
        justify-content: center;
        gap: 20px;
        align-items: flex-start;
        flex-wrap: wrap;
        margin-top: 20px;
    }

    .card {
        text-align: center;
        border: 2px solid #333;
        padding: 10px;
        background-color: #444;
        border-radius: 10px;
        width: 220px;
    }

    img {
        width: 200px;
        height: 300px;
        display: block;
        margin: 0 auto 10px auto;
        border-radius: 8px;
    }

    .btn {
        display: inline-block;
        padding: 8px 15px;
        background-color: #2196F3;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-weight: bold;
    }

    .btn:hover {
        background-color: #1976D2;
    }
  </style>

</head>
<body>

<h2>Profesionálni hráči Brawl Stars</h2>

<div class="images">

    <div class="card">
        <img src="images/jopo.jpg" alt="Jopo">
        <a href="o mne.html" class="btn">O Jopovi</a>
    </div>

    <div class="card">
        <img src="images/marko.jpg" alt="Marko">
        <a href="o marekovi markovi.html" class="btn">O Markovi</a>
    </div>

    <div class="card">
        <img src="images/adko.jpg" alt="Aďo">
        <a href="tekute.html" class="btn">O Aďovi</a>
    </div>

</div>
<div style="text-align:center; margin-top:30px;">
    <h3>🎬 Guess The Brawler</h3>

    <video controls width="400">
        <source src="pocoloco.mp4" type="video/mp4">
        Tvoj prehliadač nepodporuje video.
    </video>
</div>
</body>
  </body>
</html>

<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>Markova stránka</title>

    <link rel="stylesheet" href="styles.css">

    <style>
        img {
            width: 300px;
            height: auto;
            display: block;
            margin: 0 0 15px 0; /* obrázok naľavo */
        }

        .box {
            border: 2px solid #333;
            padding: 15px;
            width: 320px;
            text-align: left;
            margin: 50px auto;
        }

        .buttons {
            display: flex;
            justify-content: left;
            gap: 10px;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #ff69b4;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .btn:hover {
            background-color: #e055a1;
        }
    </style>
</head>
<body>

    <h2>Volam sa Marko Marek a hrám iba Edgara. Niekedy mám problém s anger issues.</h2>

    <div class="box">
        <img src="images/marko.jpg" alt="Trulli">

        <div class="buttons">
            <a href="tekute.html" class="btn">Aďo</a>
            <a href="index.html" class="btn">Späť</a>
        </div>
    </div>

</body>
</html>

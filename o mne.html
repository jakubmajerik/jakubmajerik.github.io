<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>Jopova stránka</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        img {
            width: 300px;  
            height: auto;
            display: block;
            margin-bottom: 15px;
        }

        .box {
            border: 2px solid #333;
            padding: 15px;
            width: 320px;
            text-align: left;
        }

        .buttons {
            display: flex;
            justify-content: left;
            gap: 10px;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #ff69b4;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .btn:hover {
            background-color: #e055a1;
        }
    </style>
</head>
<body>

    <h2>Volám sa Jopo a som vášnivý hráč Brawl Stars.Brawl starts hrávam 7rokov.Môj bratranec má 100Prestige.</h2>

    <div class="box">
        <img src="images/jopo.jpg" alt="kakacka">

        <div class="buttons">
            <a href="o marekovi markovi.html" class="btn">Marko</a>
            <a href="index.html" class="btn">Späť</a>
        </div>
    </div>

</body>
</html>

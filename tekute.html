<<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<title>Aďova stránka</title>

<style>

body{
    background-color:#ff69b4;
    font-family:Arial,sans-serif;
    color:white;
    margin:0;
    text-align:center;
}

/* NADPIS */
h2{
    color:yellow;
    font-size:35px;
    margin-top:30px;
    text-shadow:2px 2px 5px black;
}

/* HLAVNÝ BOX */
.box{
    border:3px solid black;
    background-color:#444;
    border-radius:15px;
    padding:20px;
    width:700px;
    margin:40px auto;
    display:flex;
    align-items:center;
    gap:30px;
    box-shadow:0 0 15px black;
}

/* OBRÁZOK */
.box img{
    width:300px;
    height:auto;
    border-radius:12px;
    display:block;
}

/* TEXT */
.text{
    flex:1;
    text-align:left;
}

.text p{
    font-size:22px;
    color:#00ffff;
    line-height:1.5;
}

/* TLAČIDLO */
.buttons{
    margin-top:20px;
}

.back-btn{
    display:inline-block;
    padding:10px 20px;
    background-color:#2196F3;
    color:white;
    text-decoration:none;
    border-radius:10px;
    font-weight:bold;
    transition:0.3s;
}

.back-btn:hover{
    background-color:#0b63b6;
    transform:scale(1.05);
}

</style>
</head>

<body>

<h2>🔥 Aďo 🔥</h2>

<div class="box">

    <!-- OBRÁZOK NAĽAVO -->
    <img src="images/adko.jpg" alt="Aďo">

    <!-- TEXT -->
    <div class="text">

        <p>
            Volám sa Aďo a Brawl Stars hrávam
            s Kevešom v Ružomberku 🎮
        </p>

        <!-- TLAČIDLO -->
        <div class="buttons">
            <a href="index.html" class="back-btn">Späť</a>
        </div>

    </div>

</div>

</body>
</html>

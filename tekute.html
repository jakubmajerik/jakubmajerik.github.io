<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>Jopova stránka</title>
       <link rel="stylesheet" href="styles.css">
    <style>
        img {
            width: 300px;  
            height: auto;
            display: block;
            margin-bottom: 15px;
        }

        .box {
            border: 2px solid #333;
            padding: 15px;
            width: 320px;
            text-align: center;
        }

        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #ff69b4;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .back-btn:hover {
            background-color: #e055a1;
        }
    </style>
</head>
<body>

    <h2>Volám sa Adko a Brawl stars hrávam s Kevešom v Ružomberku.</h2>

    <div class="box">
        <img src="images/adko.jpg" alt="tekute">
        
        <a href="index.html" class="back-btn">Späť</a>
    </div>

</body>
</html>
